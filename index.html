<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Atividade Bootstrap</title>

<link rel="stylesheet"
href="css/bootstrap.min.css">

<style>

body{
    background:black;
    color:white;
}

.carousel img{
    height:200px;
    object-fit:contain;
}

.card-img-top{
    height:120px;
    object-fit:contain;
}

.btn{
    width:100px;
    height:60px;
}

.informacoes{
    margin-top:40px;
    padding:20px;
    border:1px solid white;
}

footer{
    text-align:center;
    margin-top:40px;
    padding:20px;
}

</style>

</head>

<body>

<header>

<h1 class="text-center">
Copa do Mundo
</h1>

</header>



<main>

<!-- CAROUSEL -->

<section>

<div id="meuCarousel"
class="carousel slide"
data-bs-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="img/1.jpg"
class="d-block w-100">
</div>

<div class="carousel-item">
<img src="img/2.jpg"
class="d-block w-100">
</div>

<div class="carousel-item">
<img src="img/3.jpg"
class="d-block w-100">
</div>

<div class="carousel-item">
<img src="img/4.jpg"
class="d-block w-100">
</div>

<div class="carousel-item">
<img src="img/5.jpg"
class="d-block w-100">
</div>

<div class="carousel-item">
<img src="img/6.jpg"
class="d-block w-100">
</div>

<div class="carousel-item">
<img src="img/7.jpg"
class="d-block w-100">
</div>

<div class="carousel-item">
<img src="img/8.jpg"
class="d-block w-100">
</div>

</div>

<button class="carousel-control-prev"
data-bs-target="#meuCarousel"
data-bs-slide="prev">

<span class="carousel-control-prev-icon"></span>

</button>

<button class="carousel-control-next"
data-bs-target="#meuCarousel"
data-bs-slide="next">

<span class="carousel-control-next-icon"></span>

</button>

</div>

</section>



<!-- CARDS -->

<section class="container mt-5">

<div class="row">

<article class="col-md-3">

<div class="card">

<img src="img/1.jpg"
class="card-img-top">

<div class="card-body">

<h5>Estados Unidos</h5>

<p>Gordos e Petróleo</p>

</div>

</div>

</article>


<article class="col-md-3">

<div class="card">

<img src="img/2.jpg"
class="card-img-top">

<div class="card-body">

<h5>Alemanha</h5>

<p>Cerveja</p>

</div>

</div>

</article>


<article class="col-md-3">

<div class="card">

<img src="img/7.jpg"
class="card-img-top">

<div class="card-body">

<h5>Brasil</h5>

<p>Seleção Brasileira</p>

</div>

</div>

</article>

</div>

</section>



<!-- BOTÕES -->

<section class="container mt-4">

<button class="btn btn-primary">
Azul
</button>

<button class="btn btn-success">
Verde
</button>

<button class="btn btn-danger">
Vermelho
</button>

</section>



<!-- JOGOS -->

<section class="informacoes">

<h2>Jogos</h2>

<ul>

<li>México x África do Sul — 11/06</li>

<li>Brasil x Marrocos — 13/06</li>

<li>Canadá x Bósnia — 12/06</li>

<li>Estados Unidos x Paraguai — 12/06</li>

</ul>

</section>


</main>



<footer>

<p>
Site feito com Bootstrap
</p>

</footer>



<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
